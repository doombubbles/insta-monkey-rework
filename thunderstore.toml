[package]
name = "InstaMonkeyRework"
namespace = "doombubbles"
description = "Adds a new way to use insta monkeys: Instead of being one-time use only, you can optionally spend in-game cash for instas and they won't be removed from your collection. Price is discounted from the full amount based on the tier of the insta."
websiteUrl = "https://github.com/doombubbles/InstaMonkeyRework"

[package.dependencies]
LavaGang-MelonLoader = "0.7.3"
doombubbles-Btd6ModHelper = "3.6.5"

[build]
icon = "./Icon.png"
readme = "./README.md"
outdir = "bin"

[[build.copy]]
source = "./bin/Release/InstaMonkeyRework.dll"
target = "InstaMonkeyRework.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["bloons-td-6"]
categories = ["mods"]
